<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .sketchfab-embed-wrapper {
        width: 100%;
        height: 90vh;
        position: relative;
        overflow: hidden;
    }

    iframe {
        width: 100%;
        height: 100%;
    }

    .viewer.idle .controls>:not(.watermark):not(.no-fadeout),
    .viewer.idle .gui .hotspot-controls-responsive,
    .viewer.idle.has-animation .controls .animation-controls,
    .viewer.idle .snapshot,
    .viewer.idle .titlebar,
    .viewer.moving .controls>:not(.watermark):not(.no-fadeout),
    .viewer.moving .gui .hotspot-controls-responsive,
    .viewer.moving.has-animation .controls .animation-controls,
    .viewer.moving .snapshot,
    .viewer.moving .titlebar {
        pointer-events: none;
        opacity: 0;
        background: red;
    }

    .title {
        display: none;
        color: red;
    }

    /* Скрытие информации об авторе */
    p {
        display: none;
    }

    /* Скрытие titlebar и его содержимого */
    .titlebar {
        display: none !important;
        /* Добавлено !important */
    }
</style>

<body>
    <div class="sketchfab-embed-wrapper"> <iframe title="Ferris wheel" frameborder="0" allowfullscreen
            mozallowfullscreen="true" webkitallowfullscreen="true" allow="autoplay; fullscreen; xr-spatial-tracking"
            allow="fullscreen"
            src="https://sketchfab.com/models/2ebc1aec6d374db68166c9ab8e989b0b/embed?autospin=1&autostart=1&preload=1&transparent=1&ui_hint=2">
        </iframe>


    </div>
    <h1>бул жака соз жазып койсок болот </h1>
</body>

</html>
